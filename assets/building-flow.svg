<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" width="100%" height="100%">
  <defs>
    <linearGradient id="b-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1117" />
      <stop offset="100%" stop-color="#15181C" />
    </linearGradient>

    <linearGradient id="b-flow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="25%" stop-color="#5B8CFF" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="75%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <filter id="b-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Frame -->
  <rect width="850" height="140" rx="12" fill="url(#b-bg)" stroke="#21262D" stroke-width="1.5"/>

  <!-- Top Title & Active Status -->
  <g transform="translate(30, 25)">
    <text x="0" y="0" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CURRENTLY BUILDING</text>
    <text x="160" y="0" fill="#F5F7FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800">AI APP FACTORY</text>
    
    <!-- Active Indicator -->
    <g transform="translate(320, -12)">
      <rect width="76" height="22" rx="11" fill="#15181C" stroke="#10B981" stroke-width="1"/>
      <circle cx="12" cy="11" r="3.5" fill="#10B981" filter="url(#b-glow)"/>
      <text x="22" y="15" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">ACTIVE</text>
    </g>
  </g>

  <!-- Connection Flow Line -->
  <g transform="translate(0, 30)">
    <line x1="80" y1="55" x2="770" y2="55" stroke="url(#b-flow-grad)" stroke-width="2" filter="url(#b-glow)"/>

    <!-- Nodes -->
    <!-- 1. IDEA -->
    <g transform="translate(80, 55)">
      <rect x="-40" y="-18" width="80" height="36" rx="6" fill="#15181C" stroke="#7C3AED" stroke-width="1.5"/>
      <text x="0" y="5" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="700">IDEA</text>
    </g>

    <!-- 2. AI -->
    <g transform="translate(252.5, 55)">
      <rect x="-35" y="-18" width="70" height="36" rx="6" fill="#15181C" stroke="#5B8CFF" stroke-width="1.5"/>
      <text x="0" y="5" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="700">AI</text>
    </g>

    <!-- 3. APPLICATION -->
    <g transform="translate(425, 55)">
      <rect x="-55" y="-18" width="110" height="36" rx="6" fill="#15181C" stroke="#00F0FF" stroke-width="1.5"/>
      <text x="0" y="5" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="700">APPLICATION</text>
    </g>

    <!-- 4. VERIFY -->
    <g transform="translate(597.5, 55)">
      <rect x="-42" y="-18" width="84" height="36" rx="6" fill="#15181C" stroke="#10B981" stroke-width="1.5"/>
      <text x="0" y="5" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="700">VERIFY</text>
    </g>

    <!-- 5. SHIP -->
    <g transform="translate(770, 55)">
      <rect x="-35" y="-18" width="70" height="36" rx="6" fill="#15181C" stroke="#EC4899" stroke-width="1.5"/>
      <text x="0" y="5" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="700">SHIP</text>
    </g>
  </g>
</svg>
