<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="100%" height="100%">
  <defs>
    <linearGradient id="card-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1117" />
      <stop offset="100%" stop-color="#15181C" />
    </linearGradient>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="400" height="180" rx="10" fill="url(#card-grad2)" stroke="#21262D" stroke-width="1.5"/>

  <!-- Top Metrics Bar -->
  <g transform="translate(20, 25)">
    <!-- CPU -->
    <rect x="0" y="0" width="80" height="42" rx="6" fill="#1A1E24" stroke="#30363D" stroke-width="1"/>
    <text x="10" y="16" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="9">CPU LOAD</text>
    <text x="10" y="32" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">14.2%</text>

    <!-- RAM -->
    <rect x="90" y="0" width="80" height="42" rx="6" fill="#1A1E24" stroke="#30363D" stroke-width="1"/>
    <text x="100" y="16" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="9">RAM</text>
    <text x="100" y="32" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">2.1 GB</text>

    <!-- REDIS -->
    <rect x="180" y="0" width="80" height="42" rx="6" fill="#1A1E24" stroke="#30363D" stroke-width="1"/>
    <text x="190" y="16" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="9">REDIS RQ</text>
    <text x="190" y="32" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">OK</text>

    <!-- WEBSOCKET -->
    <rect x="270" y="0" width="90" height="42" rx="6" fill="#1A1E24" stroke="#30363D" stroke-width="1"/>
    <text x="280" y="16" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="9">WEBSOCKET</text>
    <text x="280" y="32" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">STREAMING</text>
  </g>

  <!-- Live Waveform Graph -->
  <g transform="translate(20, 80)">
    <rect width="360" height="75" rx="6" fill="#15181C" stroke="#21262D" stroke-width="1"/>
    <!-- Grid Lines -->
    <line x1="0" y1="25" x2="360" y2="25" stroke="#21262D" stroke-width="0.8" stroke-dasharray="4 4"/>
    <line x1="0" y1="50" x2="360" y2="50" stroke="#21262D" stroke-width="0.8" stroke-dasharray="4 4"/>
    
    <!-- Area Chart -->
    <path d="M 0 55 Q 40 20, 80 40 T 160 30 T 240 50 T 320 20 L 360 35 L 360 75 L 0 75 Z" fill="url(#wave-grad)"/>
    <path d="M 0 55 Q 40 20, 80 40 T 160 30 T 240 50 T 320 20 L 360 35" fill="none" stroke="#10B981" stroke-width="2"/>
    
    <!-- Live Pulse Dot -->
    <circle cx="360" cy="35" r="4" fill="#00F0FF"/>
    <circle cx="360" cy="35" r="8" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.6"/>
  </g>
</svg>
