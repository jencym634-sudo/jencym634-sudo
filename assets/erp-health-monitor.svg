<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 240" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111315" />
      <stop offset="100%" stop-color="#16191E" />
    </linearGradient>
    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Outer Card Frame -->
  <rect width="410" height="240" rx="10" fill="url(#card-bg-2)" stroke="#21262D" stroke-width="1.5"/>

  <!-- Top Visual Graphic Area (Height: 125px) -->
  <g transform="translate(15, 15)">
    <rect width="380" height="110" rx="6" fill="#0D1117" stroke="#21262D" stroke-width="1"/>
    
    <!-- Top Metrics Row -->
    <g transform="translate(12, 12)">
      <!-- CPU -->
      <rect x="0" y="0" width="80" height="32" rx="4" fill="#15181C" stroke="#21262D" stroke-width="0.8"/>
      <text x="8" y="12" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="7.5">CPU LOAD</text>
      <text x="8" y="24" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">14.2%</text>

      <!-- RAM -->
      <rect x="88" y="0" width="80" height="32" rx="4" fill="#15181C" stroke="#21262D" stroke-width="0.8"/>
      <text x="96" y="12" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="7.5">RAM</text>
      <text x="96" y="24" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">2.1 GB</text>

      <!-- REDIS -->
      <rect x="176" y="0" width="80" height="32" rx="4" fill="#15181C" stroke="#21262D" stroke-width="0.8"/>
      <text x="184" y="12" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="7.5">REDIS RQ</text>
      <text x="184" y="24" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">OK</text>

      <!-- WEBSOCKET -->
      <rect x="264" y="0" width="92" height="32" rx="4" fill="#15181C" stroke="#21262D" stroke-width="0.8"/>
      <text x="272" y="12" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="7.5">WEBSOCKET</text>
      <text x="272" y="24" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">LIVE STREAM</text>
    </g>

    <!-- Telemetry Wave Graph -->
    <g transform="translate(12, 52)">
      <rect width="356" height="46" rx="4" fill="#15181C" stroke="#21262D" stroke-width="0.8"/>
      <line x1="0" y1="16" x2="356" y2="16" stroke="#21262D" stroke-width="0.6" stroke-dasharray="3 3"/>
      <line x1="0" y1="32" x2="356" y2="32" stroke="#21262D" stroke-width="0.6" stroke-dasharray="3 3"/>
      <path d="M 0 35 Q 40 10, 80 25 T 160 18 T 240 32 T 310 12 L 356 22 L 356 46 L 0 46 Z" fill="url(#wave-grad-2)"/>
      <path d="M 0 35 Q 40 10, 80 25 T 160 18 T 240 32 T 310 12 L 356 22" fill="none" stroke="#10B981" stroke-width="1.5"/>
      <circle cx="356" cy="22" r="3" fill="#00F0FF"/>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="15" y1="140" x2="395" y2="140" stroke="#21262D" stroke-width="1"/>

  <!-- Bottom Details Area -->
  <g transform="translate(20, 162)">
    <!-- Number & Title -->
    <text x="0" y="0" fill="#5B8CFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">02 /</text>
    <text x="32" y="0" fill="#F5F7FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="0.3">ERP HEALTH MONITOR</text>
    
    <!-- Link Arrow -->
    <text x="370" y="0" fill="#5B8CFF" font-family="-apple-system, sans-serif" font-size="12" text-anchor="end" font-weight="600">VIEW ↗</text>

    <!-- Subtitle -->
    <text x="0" y="22" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400">Real-time ERP infrastructure monitoring</text>

    <!-- Tech Tags -->
    <g transform="translate(0, 36)">
      <rect width="190" height="20" rx="4" fill="#0D1117" stroke="#21262D" stroke-width="0.8"/>
      <text x="8" y="13.5" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">Frappe · Redis · WebSockets</text>
    </g>
  </g>
</svg>
