<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" width="100%" height="100%">
  <defs>
    <linearGradient id="thumb-bg-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#16191E" />
    </linearGradient>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="400" height="140" rx="8" fill="url(#thumb-bg-2)" stroke="#21262D" stroke-width="1"/>

  <!-- Top Metrics Bar -->
  <g transform="translate(15, 18)">
    <!-- CPU -->
    <rect x="0" y="0" width="85" height="34" rx="4" fill="#15181C" stroke="#21262D" stroke-width="0.8"/>
    <text x="10" y="13" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="8">CPU LOAD</text>
    <text x="10" y="26" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">14.2%</text>

    <!-- RAM -->
    <rect x="95" y="0" width="85" height="34" rx="4" fill="#15181C" stroke="#21262D" stroke-width="0.8"/>
    <text x="105" y="13" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="8">RAM</text>
    <text x="105" y="26" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">2.1 GB</text>

    <!-- REDIS -->
    <rect x="190" y="0" width="85" height="34" rx="4" fill="#15181C" stroke="#21262D" stroke-width="0.8"/>
    <text x="200" y="13" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="8">REDIS RQ</text>
    <text x="200" y="26" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">OK</text>

    <!-- WEBSOCKET -->
    <rect x="285" y="0" width="85" height="34" rx="4" fill="#15181C" stroke="#21262D" stroke-width="0.8"/>
    <text x="295" y="13" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="8">WEBSOCKET</text>
    <text x="295" y="26" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">STREAMING</text>
  </g>

  <!-- Live Waveform Graph -->
  <g transform="translate(15, 62)">
    <rect width="370" height="60" rx="4" fill="#15181C" stroke="#21262D" stroke-width="0.8"/>
    <line x1="0" y1="20" x2="370" y2="20" stroke="#21262D" stroke-width="0.6" stroke-dasharray="3 3"/>
    <line x1="0" y1="40" x2="370" y2="40" stroke="#21262D" stroke-width="0.6" stroke-dasharray="3 3"/>
    <path d="M 0 42 Q 40 12, 80 30 T 160 22 T 240 38 T 320 15 L 370 28 L 370 60 L 0 60 Z" fill="url(#wave-grad)"/>
    <path d="M 0 42 Q 40 12, 80 30 T 160 22 T 240 38 T 320 15 L 370 28" fill="none" stroke="#10B981" stroke-width="1.8"/>
    <circle cx="370" cy="28" r="3.5" fill="#00F0FF"/>
  </g>
</svg>
