<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="100%">
  <defs>
    <linearGradient id="flow-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090A" />
      <stop offset="50%" stop-color="#0E1117" />
      <stop offset="100%" stop-color="#08090A" />
    </linearGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="25%" stop-color="#5B8CFF" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="75%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <filter id="flow-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="850" height="160" rx="12" fill="url(#flow-bg)" stroke="#21262D" stroke-width="1.5"/>

  <!-- Background Connecting Line -->
  <line x1="100" y1="80" x2="750" y2="80" stroke="url(#line-grad)" stroke-width="2.5" filter="url(#flow-glow)"/>
  <line x1="100" y1="80" x2="750" y2="80" stroke="url(#line-grad)" stroke-width="2"/>

  <!-- Step 1: IDEAS -->
  <g transform="translate(100, 80)">
    <circle cx="0" cy="0" r="24" fill="#15181C" stroke="#7C3AED" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#7C3AED" filter="url(#flow-glow)"/>
    <text x="0" y="44" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="700">IDEAS</text>
  </g>

  <!-- Step 2: AI -->
  <g transform="translate(262.5, 80)">
    <circle cx="0" cy="0" r="24" fill="#15181C" stroke="#5B8CFF" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#5B8CFF" filter="url(#flow-glow)"/>
    <text x="0" y="44" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="700">AI</text>
  </g>

  <!-- Step 3: SOFTWARE -->
  <g transform="translate(425, 80)">
    <circle cx="0" cy="0" r="24" fill="#15181C" stroke="#00F0FF" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#00F0FF" filter="url(#flow-glow)"/>
    <text x="0" y="44" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="700">SOFTWARE</text>
  </g>

  <!-- Step 4: AUTOMATION -->
  <g transform="translate(587.5, 80)">
    <circle cx="0" cy="0" r="24" fill="#15181C" stroke="#10B981" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#10B981" filter="url(#flow-glow)"/>
    <text x="0" y="44" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="700">AUTOMATION</text>
  </g>

  <!-- Step 5: SYSTEMS -->
  <g transform="translate(750, 80)">
    <circle cx="0" cy="0" r="24" fill="#15181C" stroke="#EC4899" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#EC4899" filter="url(#flow-glow)"/>
    <text x="0" y="44" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="700">SYSTEMS</text>
  </g>
</svg>
