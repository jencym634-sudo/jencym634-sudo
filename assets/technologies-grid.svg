<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="100%">
  <defs>
    <linearGradient id="tech-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090A" />
      <stop offset="100%" stop-color="#0E1117" />
    </linearGradient>
  </defs>

  <rect width="850" height="160" rx="12" fill="url(#tech-bg)" stroke="#21262D" stroke-width="1.5"/>

  <!-- Row 1: AI SYSTEMS & BUSINESS SYSTEMS -->
  <g transform="translate(30, 25)">
    <!-- Card 1: AI SYSTEMS -->
    <rect width="380" height="50" rx="7" fill="#15181C" stroke="#7C3AED" stroke-width="1"/>
    <text x="18" y="20" fill="#7C3AED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1">AI &amp; AUTOMATION</text>
    <text x="18" y="38" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Python  ·  AI / LLM  ·  FastAPI</text>

    <!-- Card 2: BUSINESS SYSTEMS -->
    <g transform="translate(410, 0)">
      <rect width="380" height="50" rx="7" fill="#15181C" stroke="#5B8CFF" stroke-width="1"/>
      <text x="18" y="20" fill="#5B8CFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1">BUSINESS SYSTEMS</text>
      <text x="18" y="38" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Frappe Framework  ·  ERPNext  ·  MariaDB</text>
    </g>
  </g>

  <!-- Row 2: QUALITY & REAL-TIME SYSTEMS -->
  <g transform="translate(30, 88)">
    <!-- Card 3: QUALITY ENGINEERING -->
    <rect width="380" height="50" rx="7" fill="#15181C" stroke="#10B981" stroke-width="1"/>
    <text x="18" y="20" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1">QUALITY ENGINEERING</text>
    <text x="18" y="38" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Cypress E2E  ·  API Testing  ·  Docker</text>

    <!-- Card 4: REAL-TIME SYSTEMS -->
    <g transform="translate(410, 0)">
      <rect width="380" height="50" rx="7" fill="#15181C" stroke="#00F0FF" stroke-width="1"/>
      <text x="18" y="20" fill="#00F0FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1">REAL-TIME SYSTEMS</text>
      <text x="18" y="38" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Redis  ·  WebSockets  ·  Linux</text>
    </g>
  </g>
</svg>
