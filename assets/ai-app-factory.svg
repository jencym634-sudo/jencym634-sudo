<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 240" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111315" />
      <stop offset="100%" stop-color="#16191E" />
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
  </defs>

  <!-- Outer Card Frame -->
  <rect width="410" height="240" rx="10" fill="url(#card-bg-1)" stroke="#21262D" stroke-width="1.5"/>
  <rect x="0" y="0" width="410" height="2.5" fill="url(#purple-glow)" rx="1.25"/>

  <!-- Top Visual Graphic Area (Height: 125px) -->
  <g transform="translate(15, 15)">
    <!-- Inner Visual Canvas -->
    <rect width="380" height="110" rx="6" fill="#0D1117" stroke="#21262D" stroke-width="1"/>
    
    <!-- Left: Prompt Node -->
    <g transform="translate(15, 15)">
      <rect width="90" height="80" rx="6" fill="#15181C" stroke="#7C3AED" stroke-width="1"/>
      <rect x="10" y="12" width="35" height="5" rx="2.5" fill="#7C3AED"/>
      <rect x="10" y="26" width="70" height="3.5" rx="1.7" fill="#4B5563"/>
      <rect x="10" y="34" width="55" height="3.5" rx="1.7" fill="#4B5563"/>
      <rect x="10" y="42" width="62" height="3.5" rx="1.7" fill="#4B5563"/>
      <rect x="10" y="56" width="70" height="15" rx="3" fill="#7C3AED" opacity="0.2" stroke="#7C3AED" stroke-width="0.8"/>
      <text x="45" y="67" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle" font-weight="600">PROMPT</text>
    </g>

    <!-- Center Flow Arrow -->
    <g transform="translate(118, 55)">
      <path d="M 0 0 L 22 0" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="3 3"/>
      <circle cx="11" cy="0" r="10" fill="#15181C" stroke="#00F0FF" stroke-width="1.5"/>
      <text x="11" y="3" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle" font-weight="700">AI</text>
      <path d="M 22 0 L 40 0" stroke="#00F0FF" stroke-width="1.5"/>
      <polygon points="40,-3 46,0 40,3" fill="#00F0FF"/>
    </g>

    <!-- Right: Generated Frappe App -->
    <g transform="translate(175, 15)">
      <rect width="190" height="80" rx="6" fill="#15181C" stroke="#5B8CFF" stroke-width="1"/>
      <rect width="190" height="18" rx="6" fill="#21262D"/>
      <circle cx="10" cy="9" r="2.5" fill="#EF4444"/>
      <circle cx="17" cy="9" r="2.5" fill="#F59E0B"/>
      <circle cx="24" cy="9" r="2.5" fill="#10B981"/>
      <text x="100" y="12" fill="#9CA3AF" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">frappe_app.py</text>
      <rect x="10" y="26" width="50" height="4" rx="2" fill="#5B8CFF"/>
      <rect x="10" y="36" width="90" height="4" rx="2" fill="#4B5563"/>
      <rect x="20" y="46" width="70" height="4" rx="2" fill="#10B981" opacity="0.8"/>
      <rect x="20" y="56" width="100" height="4" rx="2" fill="#4B5563"/>
      <rect x="10" y="68" width="35" height="4" rx="2" fill="#7C3AED"/>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="15" y1="140" x2="395" y2="140" stroke="#21262D" stroke-width="1"/>

  <!-- Bottom Details Area -->
  <g transform="translate(20, 162)">
    <!-- Number & Title -->
    <text x="0" y="0" fill="#7C3AED" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">01 /</text>
    <text x="32" y="0" fill="#F5F7FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="0.3">AI APP FACTORY</text>
    
    <!-- Link Arrow -->
    <text x="370" y="0" fill="#5B8CFF" font-family="-apple-system, sans-serif" font-size="12" text-anchor="end" font-weight="600">VIEW ↗</text>

    <!-- Subtitle -->
    <text x="0" y="22" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400">Natural language → Frappe applications</text>

    <!-- Tech Tags -->
    <g transform="translate(0, 36)">
      <rect width="145" height="20" rx="4" fill="#0D1117" stroke="#21262D" stroke-width="0.8"/>
      <text x="8" y="13.5" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">Python · Frappe · AI</text>
    </g>
  </g>
</svg>
