<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="100%" height="100%">
  <defs>
    <linearGradient id="card-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1117" />
      <stop offset="100%" stop-color="#15181C" />
    </linearGradient>
    <linearGradient id="purple-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
  </defs>

  <!-- Base Card -->
  <rect width="400" height="180" rx="10" fill="url(#card-grad1)" stroke="#21262D" stroke-width="1.5"/>
  <rect x="0" y="0" width="400" height="2" fill="url(#purple-cyan)" rx="1"/>

  <!-- Left: Prompt Node -->
  <g transform="translate(25, 35)">
    <rect width="100" height="110" rx="8" fill="#1A1E24" stroke="#30363D" stroke-width="1"/>
    <rect x="12" y="15" width="40" height="6" rx="3" fill="#7C3AED"/>
    <rect x="12" y="32" width="76" height="4" rx="2" fill="#4B5563"/>
    <rect x="12" y="42" width="60" height="4" rx="2" fill="#4B5563"/>
    <rect x="12" y="52" width="68" height="4" rx="2" fill="#4B5563"/>
    <rect x="12" y="75" width="76" height="20" rx="4" fill="#7C3AED" opacity="0.2" stroke="#7C3AED" stroke-width="0.8"/>
    <text x="50" y="89" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" font-weight="600">PROMPT</text>
  </g>

  <!-- Center Arrow / Flow -->
  <g transform="translate(140, 85)">
    <path d="M 0 0 L 25 0" stroke="#7C3AED" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="15" cy="0" r="12" fill="#15181C" stroke="#00F0FF" stroke-width="1.5"/>
    <text x="15" y="3" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle" font-weight="700">AI</text>
    <path d="M 30 0 L 55 0" stroke="#00F0FF" stroke-width="2"/>
    <polygon points="55,-4 62,0 55,4" fill="#00F0FF"/>
  </g>

  <!-- Right: Generated Frappe App -->
  <g transform="translate(225, 35)">
    <rect width="150" height="110" rx="8" fill="#1A1E24" stroke="#5B8CFF" stroke-width="1.5"/>
    <!-- App Header Bar -->
    <rect width="150" height="24" rx="8" fill="#21262D"/>
    <circle cx="14" cy="12" r="3.5" fill="#EF4444"/>
    <circle cx="24" cy="12" r="3.5" fill="#F59E0B"/>
    <circle cx="34" cy="12" r="3.5" fill="#10B981"/>
    <text x="85" y="15" fill="#9CA3AF" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">frappe_app.py</text>
    
    <!-- Code Lines -->
    <rect x="12" y="36" width="60" height="5" rx="2" fill="#5B8CFF"/>
    <rect x="12" y="48" width="100" height="5" rx="2" fill="#4B5563"/>
    <rect x="24" y="60" width="80" height="5" rx="2" fill="#10B981" opacity="0.8"/>
    <rect x="24" y="72" width="110" height="5" rx="2" fill="#4B5563"/>
    <rect x="12" y="86" width="40" height="5" rx="2" fill="#7C3AED"/>
  </g>
</svg>
