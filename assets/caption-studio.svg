<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" width="100%" height="100%">
  <defs>
    <linearGradient id="thumb-bg-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#16191E" />
    </linearGradient>
  </defs>

  <rect width="400" height="140" rx="8" fill="url(#thumb-bg-4)" stroke="#21262D" stroke-width="1"/>

  <!-- Left: Video Frame Preview -->
  <g transform="translate(15, 18)">
    <rect width="150" height="104" rx="6" fill="#15181C" stroke="#7C3AED" stroke-width="1"/>
    <rect x="6" y="6" width="138" height="92" rx="4" fill="#0D1117"/>
    <circle cx="75" cy="45" r="14" fill="#7C3AED" opacity="0.8"/>
    <polygon points="70,38 84,45 70,52" fill="#FFFFFF"/>
    
    <rect x="15" y="74" width="120" height="18" rx="3" fill="#000000" opacity="0.8" stroke="#00F0FF" stroke-width="0.6"/>
    <text x="75" y="86" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle" font-weight="600">[ Subtitle Track ]</text>
  </g>

  <!-- Right: Speech & Translation Pipeline -->
  <g transform="translate(180, 18)">
    <!-- Audio Waveform -->
    <rect width="205" height="30" rx="4" fill="#15181C" stroke="#21262D" stroke-width="0.8"/>
    <text x="10" y="14" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="8">AUDIO WAVEFORM</text>
    <g transform="translate(10, 18)">
      <rect x="0" y="1" width="2" height="6" fill="#5B8CFF"/>
      <rect x="4" y="0" width="2" height="8" fill="#5B8CFF"/>
      <rect x="8" y="2" width="2" height="4" fill="#5B8CFF"/>
      <rect x="12" y="0" width="2" height="8" fill="#00F0FF"/>
      <rect x="16" y="1" width="2" height="6" fill="#5B8CFF"/>
    </g>
    <text x="145" y="19" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">WHISPER</text>

    <!-- Translation Layer -->
    <g transform="translate(0, 37)">
      <rect width="205" height="30" rx="4" fill="#15181C" stroke="#21262D" stroke-width="0.8"/>
      <text x="10" y="13" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="8">TRANSLATION LAYER</text>
      <rect x="10" y="18" width="185" height="5" rx="2" fill="#7C3AED" opacity="0.4"/>
      <rect x="10" y="18" width="110" height="5" rx="2" fill="#7C3AED"/>
    </g>

    <!-- FFmpeg Output -->
    <g transform="translate(0, 74)">
      <rect width="205" height="30" rx="4" fill="#15181C" stroke="#00F0FF" stroke-width="0.8"/>
      <text x="10" y="14" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">FFMPEG RENDERING</text>
      <text x="10" y="23" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="7.5">ASS Subtitles ➔ MP4 Export</text>
    </g>
  </g>
</svg>
