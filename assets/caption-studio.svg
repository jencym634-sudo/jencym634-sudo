<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 240" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111315" />
      <stop offset="100%" stop-color="#16191E" />
    </linearGradient>
  </defs>

  <!-- Outer Card Frame -->
  <rect width="410" height="240" rx="10" fill="url(#card-bg-4)" stroke="#21262D" stroke-width="1.5"/>

  <!-- Top Visual Graphic Area (Height: 125px) -->
  <g transform="translate(15, 15)">
    <rect width="380" height="110" rx="6" fill="#0D1117" stroke="#21262D" stroke-width="1"/>

    <!-- Left: Video Frame Preview -->
    <g transform="translate(12, 10)">
      <rect width="140" height="90" rx="5" fill="#15181C" stroke="#7C3AED" stroke-width="1"/>
      <rect x="6" y="6" width="128" height="78" rx="3" fill="#0D1117"/>
      <circle cx="70" cy="40" r="12" fill="#7C3AED" opacity="0.8"/>
      <polygon points="66,34 78,40 66,46" fill="#FFFFFF"/>
      <rect x="15" y="64" width="110" height="16" rx="3" fill="#000000" opacity="0.8" stroke="#00F0FF" stroke-width="0.6"/>
      <text x="70" y="75" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="7.5" text-anchor="middle" font-weight="600">[ Subtitle Track ]</text>
    </g>

    <!-- Right: Speech & Translation Pipeline -->
    <g transform="translate(165, 10)">
      <!-- Audio Waveform -->
      <rect width="200" height="26" rx="4" fill="#15181C" stroke="#21262D" stroke-width="0.8"/>
      <text x="10" y="12" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="7.5">AUDIO WAVEFORM</text>
      <g transform="translate(10, 16)">
        <rect x="0" y="1" width="2" height="5" fill="#5B8CFF"/>
        <rect x="4" y="0" width="2" height="7" fill="#5B8CFF"/>
        <rect x="8" y="2" width="2" height="4" fill="#5B8CFF"/>
        <rect x="12" y="0" width="2" height="7" fill="#00F0FF"/>
        <rect x="16" y="1" width="2" height="6" fill="#5B8CFF"/>
        <rect x="20" y="0" width="2" height="8" fill="#5B8CFF"/>
      </g>
      <text x="140" y="17" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700">WHISPER</text>

      <!-- Translation Layer -->
      <g transform="translate(0, 32)">
        <rect width="200" height="26" rx="4" fill="#15181C" stroke="#21262D" stroke-width="0.8"/>
        <text x="10" y="11" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="7.5">TRANSLATION LAYER</text>
        <rect x="10" y="16" width="180" height="5" rx="2" fill="#7C3AED" opacity="0.4"/>
        <rect x="10" y="16" width="100" height="5" rx="2" fill="#7C3AED"/>
      </g>

      <!-- FFmpeg Output -->
      <g transform="translate(0, 64)">
        <rect width="200" height="26" rx="4" fill="#15181C" stroke="#00F0FF" stroke-width="0.8"/>
        <text x="10" y="12" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700">FFMPEG RENDERING</text>
        <text x="10" y="21" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="7">ASS Subtitles ➔ MP4 Export</text>
      </g>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="15" y1="140" x2="395" y2="140" stroke="#21262D" stroke-width="1"/>

  <!-- Bottom Details Area -->
  <g transform="translate(20, 162)">
    <!-- Number & Title -->
    <text x="0" y="0" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">04 /</text>
    <text x="32" y="0" fill="#F5F7FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="0.3">AI CAPTION STUDIO</text>
    
    <!-- Link Arrow -->
    <text x="370" y="0" fill="#5B8CFF" font-family="-apple-system, sans-serif" font-size="12" text-anchor="end" font-weight="600">VIEW ↗</text>

    <!-- Subtitle -->
    <text x="0" y="22" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400">Speech → translation → subtitles</text>

    <!-- Tech Tags -->
    <g transform="translate(0, 36)">
      <rect width="180" height="20" rx="4" fill="#0D1117" stroke="#21262D" stroke-width="0.8"/>
      <text x="8" y="13.5" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">FastAPI · Whisper · FFmpeg</text>
    </g>
  </g>
</svg>
