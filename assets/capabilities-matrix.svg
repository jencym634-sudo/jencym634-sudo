<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="100%">
  <defs>
    <linearGradient id="cap-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090A" />
      <stop offset="100%" stop-color="#0E1117" />
    </linearGradient>
  </defs>

  <rect width="850" height="180" rx="12" fill="url(#cap-bg)" stroke="#21262D" stroke-width="1.5"/>

  <!-- Row 1 -->
  <g transform="translate(30, 25)">
    <!-- 1. AI SYSTEMS -->
    <rect width="380" height="60" rx="8" fill="#15181C" stroke="#7C3AED" stroke-width="1"/>
    <circle cx="25" cy="30" r="4" fill="#7C3AED"/>
    <text x="40" y="27" fill="#F5F7FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">AI SYSTEMS</text>
    <text x="40" y="44" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="11">LLM applications  ·  Automation</text>

    <!-- 2. BUSINESS SYSTEMS -->
    <g transform="translate(410, 0)">
      <rect width="380" height="60" rx="8" fill="#15181C" stroke="#5B8CFF" stroke-width="1"/>
      <circle cx="25" cy="30" r="4" fill="#5B8CFF"/>
      <text x="40" y="27" fill="#F5F7FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">BUSINESS SYSTEMS</text>
      <text x="40" y="44" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="11">Frappe  ·  ERPNext</text>
    </g>
  </g>

  <!-- Row 2 -->
  <g transform="translate(30, 95)">
    <!-- 3. QUALITY ENGINEERING -->
    <rect width="380" height="60" rx="8" fill="#15181C" stroke="#10B981" stroke-width="1"/>
    <circle cx="25" cy="30" r="4" fill="#10B981"/>
    <text x="40" y="27" fill="#F5F7FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">QUALITY ENGINEERING</text>
    <text x="40" y="44" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="11">Cypress  ·  API / E2E</text>

    <!-- 4. REAL-TIME SYSTEMS -->
    <g transform="translate(410, 0)">
      <rect width="380" height="60" rx="8" fill="#15181C" stroke="#00F0FF" stroke-width="1"/>
      <circle cx="25" cy="30" r="4" fill="#00F0FF"/>
      <text x="40" y="27" fill="#F5F7FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">REAL-TIME SYSTEMS</text>
      <text x="40" y="44" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="11">Redis  ·  WebSockets</text>
    </g>
  </g>
</svg>
