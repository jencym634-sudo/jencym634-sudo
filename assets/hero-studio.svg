<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <defs>
    <linearGradient id="studio-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090A" />
      <stop offset="60%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#08090A" />
    </linearGradient>

    <linearGradient id="purple-blue-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#5B8CFF" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <linearGradient id="node-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="studio-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="studio-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#21262D" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Base Card Frame -->
  <rect width="850" height="320" rx="16" fill="url(#studio-bg)" stroke="#21262D" stroke-width="1.5"/>
  <rect width="850" height="320" rx="16" fill="url(#studio-grid)"/>

  <!-- Top Edge Glow Line -->
  <rect x="0" y="0" width="850" height="3" fill="url(#purple-blue-grad)" rx="1.5"/>

  <!-- Left Hero Content Column -->
  <g transform="translate(45, 60)">
    <!-- Status Tag -->
    <g transform="translate(0, 0)">
      <rect width="180" height="28" rx="14" fill="#15181C" stroke="#30363D" stroke-width="1"/>
      <circle cx="15" cy="14" r="4" fill="#10B981" filter="url(#soft-glow)"/>
      <text x="28" y="18" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">JENCY // STUDIO ONLINE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="75" fill="#F5F7FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" letter-spacing="-1">JENCY M</text>

    <!-- Subtitle / Role -->
    <text x="0" y="108" fill="url(#purple-blue-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">SOFTWARE ENGINEER</text>

    <!-- Tagline -->
    <text x="0" y="142" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Building intelligent systems that turn ideas into software.</text>

    <!-- Capabilities Tag Bar -->
    <g transform="translate(0, 172)">
      <rect width="320" height="30" rx="6" fill="#15181C" stroke="#21262D" stroke-width="1"/>
      <text x="15" y="19" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">AI  ·  PYTHON  ·  FRAPPE  ·  QA  ·  SYSTEMS</text>
    </g>
  </g>

  <!-- Right Visual Graphics: Abstract Engineering System Node Flow -->
  <g transform="translate(460, 40)">
    <!-- Glow Backdrop -->
    <circle cx="180" cy="120" r="100" fill="url(#node-glow-grad)" filter="url(#studio-glow)"/>

    <!-- Connecting Pathways -->
    <path d="M 50 120 C 100 40, 160 40, 210 90 C 260 140, 310 140, 340 80" fill="none" stroke="url(#purple-blue-grad)" stroke-width="2" stroke-dasharray="6 4"/>
    <path d="M 60 180 L 140 120 L 220 180 L 300 120" fill="none" stroke="#30363D" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Node 1: IDEA -->
    <g transform="translate(25, 100)">
      <rect width="65" height="36" rx="8" fill="#15181C" stroke="#7C3AED" stroke-width="1.5"/>
      <text x="32.5" y="22" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="700">IDEA</text>
    </g>

    <!-- Node 2: AI Engine -->
    <g transform="translate(110, 35)">
      <rect width="60" height="36" rx="8" fill="#15181C" stroke="#5B8CFF" stroke-width="1.5"/>
      <text x="30" y="22" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="700">AI</text>
    </g>

    <!-- Node 3: SOFTWARE -->
    <g transform="translate(180, 85)">
      <rect width="80" height="36" rx="8" fill="#15181C" stroke="#00F0FF" stroke-width="1.5"/>
      <text x="40" y="22" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="700">SOFTWARE</text>
    </g>

    <!-- Node 4: AUTOMATION -->
    <g transform="translate(180, 165)">
      <rect width="90" height="36" rx="8" fill="#15181C" stroke="#10B981" stroke-width="1.5"/>
      <text x="45" y="22" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="700">AUTOMATE</text>
    </g>

    <!-- Node 5: SYSTEMS -->
    <g transform="translate(290, 70)">
      <rect width="75" height="36" rx="8" fill="#15181C" stroke="#EC4899" stroke-width="1.5"/>
      <text x="37.5" y="22" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="700">SYSTEMS</text>
    </g>

    <!-- Central Glowing Core -->
    <circle cx="220" cy="103" r="5" fill="#00F0FF" filter="url(#studio-glow)"/>
  </g>
</svg>
