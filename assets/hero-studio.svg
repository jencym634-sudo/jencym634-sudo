<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="100%">
  <defs>
    <linearGradient id="studio-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090A" />
      <stop offset="60%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#08090A" />
    </linearGradient>

    <linearGradient id="purple-cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#5B8CFF" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <pattern id="studio-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#21262D" stroke-width="0.5" opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Base Card Frame -->
  <rect width="850" height="260" rx="14" fill="url(#studio-bg)" stroke="#21262D" stroke-width="1.5"/>
  <rect width="850" height="260" rx="14" fill="url(#studio-grid)"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="850" height="2.5" fill="url(#purple-cyan-grad)" rx="1.25"/>

  <!-- Left Hero Content Column -->
  <g transform="translate(40, 48)">
    <!-- Status Tag -->
    <g transform="translate(0, 0)">
      <rect width="145" height="24" rx="12" fill="#15181C" stroke="#30363D" stroke-width="1"/>
      <circle cx="13" cy="12" r="3.5" fill="#10B981"/>
      <text x="25" y="15.5" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="0.5">JENCY // STUDIO</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="62" fill="#F5F7FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.8">JENCY M</text>

    <!-- Subtitle / Role -->
    <text x="0" y="88" fill="url(#purple-cyan-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">SOFTWARE ENGINEER</text>

    <!-- Short Specific Description -->
    <text x="0" y="118" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">Building AI applications, business systems &amp; automation.</text>

    <!-- Capabilities Tag Bar -->
    <g transform="translate(0, 142)">
      <rect width="235" height="26" rx="5" fill="#15181C" stroke="#21262D" stroke-width="1"/>
      <text x="12" y="17" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">AI  ·  PYTHON  ·  FRAPPE  ·  QA</text>
    </g>
  </g>

  <!-- Right Visual Graphics: Refined, Abstract Engineering Node Network -->
  <g transform="translate(480, 45)">
    <!-- Connection Lines -->
    <path d="M 40 85 L 105 45 L 175 85 L 245 45 L 310 85" fill="none" stroke="url(#purple-cyan-grad)" stroke-width="1.5" opacity="0.7"/>
    <path d="M 105 45 L 175 125 L 245 45" fill="none" stroke="#30363D" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Minimal Nodes -->
    <!-- 1. IDEA -->
    <g transform="translate(10, 68)">
      <rect width="60" height="34" rx="6" fill="#15181C" stroke="#7C3AED" stroke-width="1"/>
      <text x="30" y="21" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" font-weight="700">IDEA</text>
    </g>

    <!-- 2. AI -->
    <g transform="translate(80, 28)">
      <rect width="50" height="34" rx="6" fill="#15181C" stroke="#5B8CFF" stroke-width="1"/>
      <text x="25" y="21" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" font-weight="700">AI</text>
    </g>

    <!-- 3. SOFTWARE -->
    <g transform="translate(140, 68)">
      <rect width="70" height="34" rx="6" fill="#15181C" stroke="#00F0FF" stroke-width="1"/>
      <text x="35" y="21" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" font-weight="700">SYSTEM</text>
    </g>

    <!-- 4. AUTOMATE -->
    <g transform="translate(220, 28)">
      <rect width="70" height="34" rx="6" fill="#15181C" stroke="#10B981" stroke-width="1"/>
      <text x="35" y="21" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" font-weight="700">AUTO</text>
    </g>

    <!-- 5. SHIP -->
    <g transform="translate(285, 68)">
      <rect width="55" height="34" rx="6" fill="#15181C" stroke="#EC4899" stroke-width="1"/>
      <text x="27.5" y="21" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" font-weight="700">SHIP</text>
    </g>

    <!-- Subtle Center Core Dot -->
    <circle cx="175" cy="85" r="3" fill="#00F0FF"/>
  </g>
</svg>
