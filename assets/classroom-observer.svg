<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 240" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111315" />
      <stop offset="100%" stop-color="#16191E" />
    </linearGradient>
  </defs>

  <!-- Outer Card Frame -->
  <rect width="410" height="240" rx="10" fill="url(#card-bg-3)" stroke="#21262D" stroke-width="1.5"/>

  <!-- Top Visual Graphic Area (Height: 125px) -->
  <g transform="translate(15, 15)">
    <rect width="380" height="110" rx="6" fill="#0D1117" stroke="#21262D" stroke-width="1"/>

    <!-- Student Session Nodes -->
    <g transform="translate(20, 15)">
      <rect x="0" y="0" width="85" height="24" rx="4" fill="#15181C" stroke="#5B8CFF" stroke-width="0.8"/>
      <circle cx="12" cy="12" r="3" fill="#10B981"/>
      <text x="22" y="15" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="8">Session #101</text>

      <rect x="0" y="28" width="85" height="24" rx="4" fill="#15181C" stroke="#5B8CFF" stroke-width="0.8"/>
      <circle cx="12" cy="40" r="3" fill="#10B981"/>
      <text x="22" y="43" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="8">Session #102</text>

      <rect x="0" y="56" width="85" height="24" rx="4" fill="#15181C" stroke="#5B8CFF" stroke-width="0.8"/>
      <circle cx="12" cy="68" r="3" fill="#10B981"/>
      <text x="22" y="71" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="8">Session #103</text>
    </g>

    <!-- Center WebSocket Hub -->
    <g transform="translate(125, 25)">
      <path d="M 0 12 L 45 27" stroke="#5B8CFF" stroke-width="1" stroke-dasharray="2 2"/>
      <path d="M 0 40 L 45 40" stroke="#00F0FF" stroke-width="1.2"/>
      <path d="M 0 68 L 45 53" stroke="#5B8CFF" stroke-width="1" stroke-dasharray="2 2"/>
      <circle cx="45" cy="40" r="14" fill="#15181C" stroke="#00F0FF" stroke-width="1.5"/>
      <text x="45" y="43" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="7.5" text-anchor="middle" font-weight="700">WS</text>
    </g>

    <!-- Teacher Dashboard -->
    <g transform="translate(210, 15)">
      <rect width="150" height="80" rx="5" fill="#15181C" stroke="#30363D" stroke-width="0.8"/>
      <rect width="150" height="18" rx="5" fill="#21262D"/>
      <text x="75" y="12" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle" font-weight="600">OBSERVER HUB</text>
      <rect x="10" y="26" width="130" height="14" rx="3" fill="#10B981" opacity="0.15" stroke="#10B981" stroke-width="0.6"/>
      <text x="16" y="36" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="7.5">✓ Verified Active Feed</text>
      <rect x="10" y="44" width="130" height="14" rx="3" fill="#15181C" stroke="#30363D" stroke-width="0.6"/>
      <text x="16" y="54" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="7.5">Fingerprint Match</text>
      <rect x="10" y="62" width="130" height="12" rx="3" fill="#5B8CFF" opacity="0.2" stroke="#5B8CFF" stroke-width="0.6"/>
      <text x="75" y="71" fill="#5B8CFF" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle" font-weight="700">REALTIME SYNC</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="15" y1="140" x2="395" y2="140" stroke="#21262D" stroke-width="1"/>

  <!-- Bottom Details Area -->
  <g transform="translate(20, 162)">
    <!-- Number & Title -->
    <text x="0" y="0" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">03 /</text>
    <text x="32" y="0" fill="#F5F7FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="0.3">LIVE CLASSROOM OBSERVER</text>
    
    <!-- Link Arrow -->
    <text x="370" y="0" fill="#5B8CFF" font-family="-apple-system, sans-serif" font-size="12" text-anchor="end" font-weight="600">VIEW ↗</text>

    <!-- Subtitle -->
    <text x="0" y="22" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400">Real-time attendance &amp; engagement</text>

    <!-- Tech Tags -->
    <g transform="translate(0, 36)">
      <rect width="190" height="20" rx="4" fill="#0D1117" stroke="#21262D" stroke-width="0.8"/>
      <text x="8" y="13.5" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600">FastAPI · Redis · WebSockets</text>
    </g>
  </g>
</svg>
