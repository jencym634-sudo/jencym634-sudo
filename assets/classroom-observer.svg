<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="100%" height="100%">
  <defs>
    <linearGradient id="card-grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1117" />
      <stop offset="100%" stop-color="#15181C" />
    </linearGradient>
  </defs>

  <rect width="400" height="180" rx="10" fill="url(#card-grad3)" stroke="#21262D" stroke-width="1.5"/>

  <!-- Left: Student Session Nodes -->
  <g transform="translate(30, 30)">
    <!-- Node 1 -->
    <rect x="0" y="0" width="90" height="32" rx="6" fill="#1A1E24" stroke="#5B8CFF" stroke-width="1"/>
    <circle cx="15" cy="16" r="4" fill="#10B981"/>
    <text x="26" y="20" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="9">Session #101</text>

    <!-- Node 2 -->
    <rect x="0" y="44" width="90" height="32" rx="6" fill="#1A1E24" stroke="#5B8CFF" stroke-width="1"/>
    <circle cx="15" cy="60" r="4" fill="#10B981"/>
    <text x="26" y="64" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="9">Session #102</text>

    <!-- Node 3 -->
    <rect x="0" y="88" width="90" height="32" rx="6" fill="#1A1E24" stroke="#5B8CFF" stroke-width="1"/>
    <circle cx="15" cy="104" r="4" fill="#10B981"/>
    <text x="26" y="108" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="9">Session #103</text>
  </g>

  <!-- Center WebSocket Channels -->
  <g transform="translate(130, 46)">
    <path d="M 0 0 L 60 40" stroke="#5B8CFF" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M 0 44 L 60 44" stroke="#00F0FF" stroke-width="1.5"/>
    <path d="M 0 88 L 60 48" stroke="#5B8CFF" stroke-width="1.5" stroke-dasharray="3 3"/>
    
    <!-- Central Hub -->
    <circle cx="60" cy="44" r="18" fill="#15181C" stroke="#00F0FF" stroke-width="2"/>
    <text x="60" y="48" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle" font-weight="700">WS</text>
  </g>

  <!-- Right: Teacher Observer Dashboard -->
  <g transform="translate(230, 30)">
    <rect width="140" height="120" rx="8" fill="#1A1E24" stroke="#30363D" stroke-width="1"/>
    <!-- Top Header -->
    <rect width="140" height="24" rx="8" fill="#21262D"/>
    <text x="70" y="16" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" font-weight="600">OBSERVER HUB</text>
    
    <!-- Live Attendance List -->
    <rect x="10" y="34" width="120" height="18" rx="4" fill="#10B981" opacity="0.15" stroke="#10B981" stroke-width="0.8"/>
    <text x="16" y="46" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="8">✓ Verified Active</text>
    
    <rect x="10" y="58" width="120" height="18" rx="4" fill="#15181C" stroke="#30363D" stroke-width="0.8"/>
    <text x="16" y="70" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="8">Fingerprint Match</text>
    
    <rect x="10" y="82" width="120" height="26" rx="4" fill="#5B8CFF" opacity="0.2" stroke="#5B8CFF" stroke-width="0.8"/>
    <text x="70" y="98" fill="#5B8CFF" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle" font-weight="700">REALTIME FEED</text>
  </g>
</svg>
