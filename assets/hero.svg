<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090A" />
      <stop offset="50%" stop-color="#0E1117" />
      <stop offset="100%" stop-color="#08090A" />
    </linearGradient>

    <!-- Accent Gradient (Purple to Cyan) -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#5B8CFF" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1F2937" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Card Outer Frame -->
  <rect width="850" height="260" rx="14" fill="url(#bg-grad)" stroke="#21262D" stroke-width="1.5"/>
  <rect width="850" height="260" rx="14" fill="url(#grid)"/>

  <!-- Top Decorative Accent Line -->
  <rect x="0" y="0" width="850" height="3" fill="url(#accent-grad)" rx="1.5"/>

  <!-- Left Content Column -->
  <g transform="translate(45, 55)">
    <!-- Status Indicator -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="165" height="26" rx="13" fill="#15181C" stroke="#30363D" stroke-width="1"/>
      <circle cx="14" cy="13" r="4" fill="#10B981" filter="url(#subtle-glow)"/>
      <text x="26" y="17" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">JENCY.OS // ONLINE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="65" fill="#F5F7FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">JENCY M</text>

    <!-- Subtitle / Role -->
    <text x="0" y="95" fill="url(#accent-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="1">SOFTWARE ENGINEER</text>

    <!-- One-line Description -->
    <text x="0" y="124" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">Building intelligent systems, automation &amp; developer tools.</text>

    <!-- Tech Pills -->
    <g transform="translate(0, 145)">
      <text x="0" y="15" fill="#6B7280" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="500" letter-spacing="0.5">AI  ·  PYTHON  ·  FRAPPE  ·  QA  ·  SYSTEMS</text>
    </g>
  </g>

  <!-- Right Visual Graphics (Abstract System Network Architecture) -->
  <g transform="translate(520, 30)">
    <!-- Ambient Glow Backdrop -->
    <circle cx="160" cy="100" r="80" fill="#7C3AED" opacity="0.12" filter="url(#glow)"/>
    <circle cx="210" cy="120" r="60" fill="#5B8CFF" opacity="0.1" filter="url(#glow)"/>

    <!-- Connection Paths -->
    <path d="M 40 100 L 110 50 L 190 70 L 250 140 L 180 170 L 110 140 Z" fill="none" stroke="#30363D" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M 110 50 L 180 170" fill="none" stroke="#7C3AED" stroke-width="1.5" opacity="0.6"/>
    <path d="M 40 100 L 190 70" fill="none" stroke="#5B8CFF" stroke-width="1.5" opacity="0.6"/>
    <path d="M 110 140 L 250 140" fill="none" stroke="#00F0FF" stroke-width="1.5" opacity="0.6"/>

    <!-- Nodes / Cards -->
    <!-- Node 1: AI Prompt -->
    <g transform="translate(10, 85)">
      <rect x="0" y="0" width="60" height="30" rx="6" fill="#15181C" stroke="#7C3AED" stroke-width="1.5"/>
      <text x="30" y="19" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="700">AI</text>
    </g>

    <!-- Node 2: Frappe App -->
    <g transform="translate(80, 35)">
      <rect x="0" y="0" width="70" height="30" rx="6" fill="#15181C" stroke="#5B8CFF" stroke-width="1.5"/>
      <text x="35" y="19" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="700">Frappe</text>
    </g>

    <!-- Node 3: Python Engine -->
    <g transform="translate(160, 55)">
      <rect x="0" y="0" width="70" height="30" rx="6" fill="#15181C" stroke="#00F0FF" stroke-width="1.5"/>
      <text x="35" y="19" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="700">Python</text>
    </g>

    <!-- Node 4: QA / Cypress -->
    <g transform="translate(220, 125)">
      <rect x="0" y="0" width="60" height="30" rx="6" fill="#15181C" stroke="#10B981" stroke-width="1.5"/>
      <text x="30" y="19" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="700">QA</text>
    </g>

    <!-- Node 5: Redis / Real-Time -->
    <g transform="translate(145, 155)">
      <rect x="0" y="0" width="75" height="30" rx="6" fill="#15181C" stroke="#EC4899" stroke-width="1.5"/>
      <text x="37.5" y="19" fill="#F5F7FA" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="700">Events</text>
    </g>

    <!-- Center Pulse Point -->
    <circle cx="145" cy="100" r="5" fill="#00F0FF" filter="url(#glow)"/>
    <circle cx="145" cy="100" r="10" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.5"/>
  </g>
</svg>
